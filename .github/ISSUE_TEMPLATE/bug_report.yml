name: Bug report
description: Something renders or behaves wrong
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: e.g. Dialog
    validations:
      required: true
  - type: dropdown
    id: style
    attributes:
      label: Style
      multiple: true
      options: [Raw, Vector, Volume]
    validations:
      required: true
  - type: dropdown
    id: scheme
    attributes:
      label: Color scheme
      options: [Light, Dark, Both]
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Steps to reproduce, screenshots, browser and OS.
    validations:
      required: true
